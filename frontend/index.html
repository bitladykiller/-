<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b09" />
    <title>AssistGen · 智能客服控制台</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Albert+Sans:wght@400;500;600;700&family=Fragment+Mono&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Vue 挂载前的极简金菱启动占位，避免白屏闪烁 */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #070b09;
      }
      #app:empty {
        height: 100%;
        display: grid;
        place-items: center;
      }
      #app:empty::before {
        content: "";
        width: 16px;
        height: 16px;
        transform: rotate(45deg);
        background: linear-gradient(135deg, #edd49a, #a9803f);
        animation: ag-splash 1s ease-in-out infinite alternate;
      }
      @keyframes ag-splash {
        from {
          opacity: 0.3;
          box-shadow: 0 0 0 rgba(216, 178, 106, 0);
        }
        to {
          opacity: 1;
          box-shadow: 0 0 26px rgba(216, 178, 106, 0.55);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
