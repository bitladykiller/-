<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>AssistGen · 智能客服</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="app-bg" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="grid-fade"></div>
  </div>

  <div id="app" class="shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="28" height="28"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c9cff"/><stop offset="1" stop-color="#5eead4"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#g)" opacity=".2"/><path d="M8 16c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8c-1.2 0-2.4-.3-3.4-.7L8 24l1.2-3.5C8.4 19.2 8 17.6 8 16z" fill="none" stroke="url(#g)" stroke-width="1.8"/></svg>
          </div>
          <div>
            <div class="brand-title">AssistGen</div>
            <div class="brand-sub">智能客服 · Agent</div>
          </div>
        </div>
        <button type="button" class="btn btn-primary btn-block" id="btnNewChat" title="新建会话">
          <span class="btn-icon">＋</span> 新对话
        </button>
      </div>

      <div class="sidebar-meta">
        <label class="field">
          <span>用户 ID</span>
          <input type="number" id="userIdInput" min="1" value="1" />
        </label>
        <div class="status-row">
          <span class="dot" id="healthDot" title="后端健康"></span>
          <span id="healthText">检测中…</span>
        </div>
      </div>

      <div class="conv-list-wrap">
        <div class="conv-list-head">会话</div>
        <ul class="conv-list" id="convList"></ul>
        <div class="empty-hint" id="convEmpty">暂无会话，点击「新对话」开始</div>
      </div>

      <div class="sidebar-foot">
        <button type="button" class="btn btn-ghost btn-sm" id="btnRefresh">刷新列表</button>
        <a class="link-muted" href="/docs" target="_blank" rel="noopener">API Docs</a>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button type="button" class="btn btn-icon-only sidebar-toggle" id="btnToggleSidebar" aria-label="切换侧栏">☰</button>
        <div class="topbar-title">
          <h1 id="chatTitle">智能客服</h1>
          <p id="chatSubtitle">支持图谱检索 · 文档 RAG · 分层记忆</p>
        </div>
        <div class="topbar-actions">
          <button type="button" class="btn btn-ghost btn-sm" id="btnUpload" title="上传知识文档">上传文档</button>
          <button type="button" class="btn btn-ghost btn-sm danger" id="btnDeleteChat" disabled>删除会话</button>
        </div>
      </header>

      <section class="chat-panel" id="chatPanel">
        <div class="welcome" id="welcome">
          <div class="welcome-card">
            <h2>你好，我是 AssistGen</h2>
            <p>智能家居电商客服助手。可以问价格、库存、订单，或保修与使用说明（需先上传文档）。</p>
            <div class="chips">
              <button type="button" class="chip" data-q="智能门锁有哪些型号？">智能门锁型号</button>
              <button type="button" class="chip" data-q="保修政策是怎样的？">保修政策</button>
              <button type="button" class="chip" data-q="订单 10248 的状态">订单查询</button>
            </div>
          </div>
        </div>
        <div class="messages" id="messages" hidden></div>
      </section>

      <footer class="composer">
        <div class="composer-inner">
          <textarea id="input" rows="1" placeholder="输入问题，Enter 发送 · Shift+Enter 换行"></textarea>
          <button type="button" class="btn btn-primary btn-send" id="btnSend" disabled>
            <span>发送</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="composer-hint" id="composerHint">准备就绪</div>
      </footer>
    </main>
  </div>

  <!-- Upload modal -->
  <div class="modal" id="uploadModal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-labelledby="uploadTitle">
      <header class="modal-head">
        <h3 id="uploadTitle">上传知识文档</h3>
        <button type="button" class="btn btn-icon-only" data-close aria-label="关闭">×</button>
      </header>
      <p class="modal-desc">支持 <strong>.md / .markdown / .pdf / .docx</strong>，后台异步解析入库。</p>
      <label class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept=".md,.markdown,.pdf,.docx,application/pdf,text/markdown,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden />
        <span class="drop-icon">⬆</span>
        <span class="drop-text">点击或拖拽文件到此处</span>
        <span class="drop-file" id="dropFileName"></span>
      </label>
      <div class="upload-progress" id="uploadProgress" hidden>
        <div class="bar"><i id="uploadBar"></i></div>
        <span id="uploadStatus">等待上传…</span>
      </div>
      <footer class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close>取消</button>
        <button type="button" class="btn btn-primary" id="btnDoUpload" disabled>开始上传</button>
      </footer>
    </div>
  </div>

  <div class="toast-host" id="toastHost" aria-live="polite"></div>
  <script src="/assets/app.js" type="module"></script>
</body>
</html>
